name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Not a secret. Only needed once the relay is compiled in (RELAY_ENABLED).
      DESKLINK_RELAY_URL: ${{ vars.DESKLINK_RELAY_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The tag is the version
        run: |
          grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" build.gradle.kts || {
            echo "::error::tag $GITHUB_REF_NAME does not match versionName in build.gradle.kts"; exit 1; }
          # The relay address is only needed once the relay is compiled in (RELAY_ENABLED).
          if [ -z "$DESKLINK_RELAY_URL" ] && grep -Eq 'buildConfigField\("boolean", "RELAY_ENABLED", "true"\)' build.gradle.kts; then
            echo "::error::DESKLINK_RELAY_URL is not set but the relay is enabled in this build"; exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore the upload key
        id: signing
        # The only step that sees the keystore secret. Without it the APK is unsigned.
        env:
          KEYSTORE_BASE64: ${{ secrets.DESKLINK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "DESKLINK_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key is configured: the APK is UNSIGNED and cannot be installed. The release is a DRAFT; set the DESKLINK_UPLOAD_* secrets and re-run to publish."
            {
              echo "## UNSIGNED build"
              echo "No \`DESKLINK_UPLOAD_KEYSTORE_BASE64\` secret: this APK cannot be installed by Android. The GitHub release was created as a **draft** and is not public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build
        # The passwords are visible to this step only.
        env:
          DESKLINK_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.DESKLINK_UPLOAD_KEYSTORE_PASSWORD }}
          DESKLINK_UPLOAD_KEY_ALIAS: ${{ secrets.DESKLINK_UPLOAD_KEY_ALIAS }}
          DESKLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.DESKLINK_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Release dex guard
        run: |
          scripts/check-release-dex.sh --apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then scripts/check-release-dex.sh --aab; fi
      - name: Collect artifacts
        run: |
          mkdir dist
          version="${GITHUB_REF_NAME#v}"
          for apk in build/outputs/apk/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) cp "$apk" "dist/desklink-$version-unsigned.apk" ;;
              *) cp "$apk" "dist/desklink-$version.apk" ;;
            esac
          done
          # The bundle is for Play upload; it is only useful signed with the upload key.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then cp build/outputs/bundle/release/*.aab "dist/desklink-$version.aab"; fi
          cp build/outputs/mapping/release/mapping.txt "dist/desklink-$version-mapping.txt"
          (cd dist && sha256sum * > SHA256SUMS)
          versionCode=$(grep -oP 'versionCode = \K[0-9]+' build.gradle.kts)
          echo "NOTES=fastlane/metadata/android/en-US/changelogs/$versionCode.txt" >> "$GITHUB_ENV"
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          # 0.x is a beta: never "latest". Unsigned builds stay drafts.
          prerelease: true
          draft: ${{ steps.signing.outputs.draft == 'true' }}
          name: ${{ github.ref_name }} (beta)
          body_path: ${{ env.NOTES }}
          fail_on_unmatched_files: true
