name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Set as repository secrets (docs/RELEASE.md). Without them the APK is unsigned.
      KEYSTORE_BASE64: ${{ secrets.DESKLINK_UPLOAD_KEYSTORE_BASE64 }}
      DESKLINK_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.DESKLINK_UPLOAD_KEYSTORE_PASSWORD }}
      DESKLINK_UPLOAD_KEY_ALIAS: ${{ secrets.DESKLINK_UPLOAD_KEY_ALIAS }}
      DESKLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.DESKLINK_UPLOAD_KEY_PASSWORD }}
      DESKLINK_RELAY_URL: ${{ vars.DESKLINK_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the upload key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "DESKLINK_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect artifacts
        run: |
          mkdir dist
          version="${GITHUB_REF_NAME#v}"
          for apk in build/outputs/apk/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) cp "$apk" "dist/desklink-$version-unsigned.apk" ;;
              *) cp "$apk" "dist/desklink-$version.apk" ;;
            esac
          done
          # The bundle is for Play upload; it is only useful signed with the upload key.
          if [ -n "$KEYSTORE_BASE64" ]; then cp build/outputs/bundle/release/*.aab "dist/desklink-$version.aab"; fi
          cp build/outputs/mapping/release/mapping.txt "dist/desklink-$version-mapping.txt"
          (cd dist && sha256sum * > SHA256SUMS)
          versionCode=$(grep -oP 'versionCode = \K[0-9]+' build.gradle.kts)
          echo "NOTES=fastlane/metadata/android/en-US/changelogs/$versionCode.txt" >> "$GITHUB_ENV"
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ env.NOTES }}
          fail_on_unmatched_files: true
